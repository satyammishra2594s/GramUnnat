<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <meta name="description" content="GramUnnat has moved. Visit the live GramUnnat website.">
  <title>GramUnnat — The Aftermath</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #07152f;
      --blue: #123d70;
      --lava: #ff4d18;
      --ember: #ff9b35;
      --ice: #d9edff;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; isolation: isolate; position: relative; padding: 24px;
      color: #f6f8ff;
      background:
        radial-gradient(ellipse at 16% 15%, rgba(255, 65, 20, .36), transparent 34%),
        radial-gradient(ellipse at 86% 78%, rgba(15, 95, 170, .48), transparent 38%),
        radial-gradient(ellipse at 50% 115%, rgba(255, 104, 24, .42), transparent 43%),
        linear-gradient(135deg, #030817 0%, #07152f 44%, #0b2348 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      content: ""; position: fixed; z-index: -2; pointer-events: none;
      width: 72vmax; height: 72vmax; border-radius: 44%;
      filter: blur(36px); opacity: .68;
    }
    body::before {
      left: -32vmax; top: -36vmax;
      background: conic-gradient(from 20deg, #ff3d14, #9e1425, #ff8a24, #50162c, #ff3d14);
      animation: magma-swirl 19s linear infinite;
    }
    body::after {
      right: -38vmax; bottom: -42vmax;
      background: conic-gradient(from 200deg, #07152f, #174e91, #0b244d, #ff521e, #07152f);
      animation: magma-swirl 25s linear infinite reverse;
    }
    .heat-haze {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: repeating-linear-gradient(115deg, transparent 0 9%, rgba(255, 104, 38, .035) 10%, transparent 11% 20%);
      animation: haze 8s ease-in-out infinite alternate;
    }
    main {
      width: min(100%, 620px); position: relative; text-align: center;
      padding: clamp(30px, 6vw, 54px) clamp(22px, 5vw, 44px);
      border: 1px solid rgba(160, 202, 255, .28); border-radius: 28px;
      background: linear-gradient(145deg, rgba(8, 21, 45, .89), rgba(13, 31, 62, .78));
      box-shadow: 0 0 0 1px rgba(255, 91, 32, .09), 0 24px 90px rgba(0, 0, 0, .55),
        0 0 70px rgba(255, 69, 24, .17), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; margin-bottom: 22px;
      padding: 8px 12px; border: 1px solid rgba(255, 120, 56, .35);
      border-radius: 999px; background: rgba(255, 79, 24, .09);
      color: #ffbd8a; text-transform: uppercase; letter-spacing: .19em;
      font-size: .68rem; font-weight: 800;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ff642a;
      box-shadow: 0 0 12px #ff642a;
    }
    .mark {
      display: grid; place-items: center; width: 94px; height: 94px; margin: 0 auto 22px;
      border-radius: 28px; font-size: 48px;
      background: linear-gradient(145deg, rgba(255, 110, 35, .24), rgba(18, 72, 130, .5));
      border: 1px solid rgba(255, 166, 95, .4);
      box-shadow: 0 0 40px rgba(255, 75, 24, .22), inset 0 0 25px rgba(56, 145, 255, .12);
    }
    h1 {
      margin: 0 auto 16px; max-width: 510px; line-height: 1.04;
      font-size: clamp(2.1rem, 7.5vw, 4.1rem); letter-spacing: -.055em;
      font-weight: 900;
      background: linear-gradient(105deg, #fff4e8 0%, #ff9b5e 31%, #ff4d20 53%, #b7dfff 77%, #fff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      background-size: 220% auto;
    }
    p { margin: 0 auto 12px; max-width: 440px; line-height: 1.75; color: #c3d4ee; }
    .lead { font-size: 1.08rem; color: #edf5ff; }
    .cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      margin-top: 20px; padding: 15px 24px; border-radius: 13px;
      color: #fff; text-decoration: none; font-weight: 850; letter-spacing: .01em;
      background: linear-gradient(110deg, #ff4c1d, #ff7c2d 48%, #174f8e);
      background-size: 180% auto; border: 1px solid rgba(255, 208, 174, .42);
      box-shadow: 0 9px 32px rgba(255, 75, 24, .25), inset 0 1px rgba(255,255,255,.2);
      transition: transform .2s ease, box-shadow .2s ease, background-position .4s ease;
    }
    .cta:hover, .cta:focus-visible {
      transform: translateY(-3px) scale(1.025); background-position: right center;
      box-shadow: 0 13px 42px rgba(255, 75, 24, .4), 0 0 25px rgba(55, 147, 255, .22);
      outline: 2px solid #c3e2ff; outline-offset: 4px;
    }
    .note { margin-top: 22px; font-size: .8rem; color: #819bc0; }
    .note span { color: #ff9a68; }
    @keyframes magma-swirl { to { transform: rotate(360deg) scale(1.08); } }
    @keyframes haze { from { opacity: .35; transform: translateY(1%); } to { opacity: .9; transform: translateY(-1%); } }
    @media (prefers-reduced-motion: reduce) { body::before, body::after, .heat-haze { animation: none !important; } }
  </style>
</head>
<body>
  <div class="heat-haze" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="status-dot"></span> New home · Same mission</div>
    <div class="mark" aria-hidden="true">🌾</div>
    <h1>WE HAVE<br>EVOLVED.</h1>
    <p class="lead">GramUnnat has moved to another platform.</p>
    <p>The mission continues. Visit our website on its new platform.</p>
    <a class="cta" href="https://lambent-heliotrope-564754.netlify.app/" rel="noopener noreferrer">ENTER GRAMUNNAT <span aria-hidden="true">↗</span></a>
    <p class="note"><span>●</span> Destination: GramUnnat · Please use the button above</p>
  </main>
</body>
</html>
