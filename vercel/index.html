<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203420">
  <title>GramUnnat — Website Moved</title>
  <style>
    :root { color-scheme: light; --green: #203420; --gold: #d9a441; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f6f1e6; color: #2b2417;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 560px); text-align: center; background: #fffdf8;
      border: 1px solid #e3d9c2; border-radius: 22px; padding: 42px 28px;
      box-shadow: 0 18px 50px rgba(32, 52, 32, .12);
    }
    .mark {
      display: inline-grid; place-items: center; width: 68px; height: 68px;
      border-radius: 18px; background: var(--green); color: #fff; font-size: 34px;
      margin-bottom: 16px;
    }
    h1 { color: var(--green); font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0 0 12px; }
    p { line-height: 1.65; color: #5c5240; margin: 0 0 12px; }
    a {
      display: inline-block; margin-top: 14px; padding: 13px 22px;
      border-radius: 10px; background: var(--green); color: #fff;
      text-decoration: none; font-weight: 700;
    }
    a:hover, a:focus-visible { background: #304c2d; outline: 3px solid var(--gold); outline-offset: 3px; }
    .note { font-size: .9rem; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🌾</div>
    <h1>Website Moved to Another Platform</h1>
    <p>GramUnnat has moved to another platform.</p>
    <p>Please click below to continue to our website.</p>
    <a href="https://lambent-heliotrope-564754.netlify.app/" rel="noopener">Visit GramUnnat</a>
    <p class="note">If you are not redirected, use the button above.</p>
  </main>
</body>
</html>
